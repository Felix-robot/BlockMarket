[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockmarket"
version = "0.3.0"
description = "Deterministic, auditable two-player synthetic market game engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
blockmarket = "blockmarket.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
